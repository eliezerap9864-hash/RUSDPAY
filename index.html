<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RUSDPAY</title>
  <script src="https://telegram.org"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f9; color: #111827; margin: 0; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge { font-size: 12px; background: #e5e7eb; padding: 6px 10px; border-radius: 8px; font-weight: bold; }
    .card { background: linear-gradient(135deg, #1d4ed8, #2563eb); padding: 24px; border-radius: 20px; color: #fff; margin-bottom: 20px; }
    .card h1 { font-size: 38px; margin: 6px 0; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .btn { background: #fff; border: 1px solid #e5e7eb; padding: 14px; border-radius: 14px; font-weight: bold; cursor: pointer; }
    .btn.active { background: #2563eb; color: #fff; }
    .panel { background: #fff; padding: 18px; border-radius: 16px; margin-bottom: 20px; display: none; }
    .panel.show { display: block; }
    input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #d1d5db; box-sizing: border-box; font-size: 16px; }
    .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #2563eb; color: #fff; font-size: 16px; font-weight: bold; }
    .tx-box { background: #fff; padding: 12px 16px; border-radius: 16px; }
    .tx { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
  </style>
</head>
<body>
  <div class="header">
    <div><small style="color:#6b7280;">Bienvenido,</small><h3 id="uName" style="margin:0;">Usuario</h3></div>
    <span id="uBadge" class="badge">ID: ---</span>
  </div>
  <div class="card">
    <small>SALDO DISPONIBLE (RUSD)</small>
    <h1 id="bal">$0.00</h1>
    <small id="uHandle">@usuario</small>
  </div>
  <div class="actions">
    <button class="btn active" id="tSend" onclick="tab('send')">↑ Enviar</button>
    <button class="btn" id="tRec" onclick="tab('rec')">↓ Recibir</button>
  </div>
  <div id="pSend" class="panel show">
    <h4 style="margin-top:0;">Transferir Fondos</h4>
    <input type="text" id="dest" placeholder="ID numérico del destinatario">
    <input type="number" id="amt" step="0.01" placeholder="Monto (ej. 10.00)">
    <button class="btn-main" id="sBtn" onclick="enviar()">Confirmar Envío</button>
  </div>
  <div id="pRec" class="panel" style="text-align:center;">
    <h4 style="margin-top:0;">Tu Dirección de Recepción</h4>
    <img id="qr" width="150" height="150" style="border:1px solid #eee;padding:8px;border-radius:12px;">
    <button class="btn-main" onclick="copiar()">Copiar mi ID</button>
  </div>
  <h4 style="margin-bottom:8px;">Últimos Movimientos</h4>
  <div id="txs" class="tx-box"><p style="text-align:center;color:#6b7280;">Conectando...</p></div>

  <script>
    const DB = "https://googleapis.com";
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : { id: "1001", first_name: "Usuario", username: "" };
    const myId = String(u.id);
    document.getElementById('uName').innerText = u.first_name;
    document.getElementById('uBadge').innerText = "ID: " + myId;
    document.getElementById('uHandle').innerText = u.username ? "@" + u.username : "ID: " + myId;
    document.getElementById('qr').src = "https://qrserver.com" + myId;

    async function cargar() {
      try {
        const r = await fetch(`${DB}/wallets/${myId}`);
        let saldo = 100;
        if (r.status === 404) {
          await fetch(`${DB}/wallets?documentId=${myId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fields: { balance: { doubleValue: 100 }, name: { stringValue: u.first_name } } })
          });
        } else if (r.ok) {
          const d = await r.json();
          saldo = d.fields.balance.doubleValue || d.fields.balance.integerValue || 0;
        } else {
          throw new Error("HTTP " + r.status);
        }
        document.getElementById('bal').innerText = "$" + Number(saldo).toFixed(2);
        document.getElementById('txs').innerHTML = '<p style="text-align:center;color:#6b7280;">Cuenta activa y lista</p>';
      } catch (e) {
        document.getElementById('txs').innerHTML = '<p style="text-align:center;color:red;">Error: ' + e.message + '</p>';
      }
    }

    async function enviar() {
      const to = document.getElementById('dest').value.trim();
      const val = parseFloat(document.getElementById('amt').value);
      if (!to || isNaN(val) || val <= 0 || to === myId) return alert("Revisa el ID y el monto");
      const btn = document.getElementById('sBtn');
      btn.disabled = true; btn.innerText = "Enviando...";
      try {
        const r1 = await fetch(`${DB}/wallets/${myId}`);
        const d1 = await r1.json();
        const s1 = Number(d1.fields.balance.doubleValue || d1.fields.balance.integerValue || 0);
        if (s1 < val) throw new Error("Saldo insuficiente");

        const r2 = await fetch(`${DB}/wallets/${to}`);
        if (!r2.ok) throw new Error("El ID destino no existe en la app");
        const d2 = await r2.json();
        const s2 = Number(d2.fields.balance.doubleValue || d2.fields.balance.integerValue || 0);

        await fetch(`${DB}/wallets/${myId}?updateMask.fieldPaths=balance`, {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fields: { balance: { doubleValue: s1 - val } } })
        });
        await fetch(`${DB}/wallets/${to}?updateMask.fieldPaths=balance`, {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fields: { balance: { doubleValue: s2 + val } } })
        });
        alert("¡Transferencia exitosa de $" + val.toFixed(2) + "!");
        document.getElementById('dest').value = "";
        document.getElementById('amt').value = "";
        cargar();
      } catch (e) { alert(e.message); }
      btn.disabled = false; btn.innerText = "Confirmar Envío";
    }

    function tab(t) {
      document.getElementById('pSend').className = t === 'send' ? 'panel show' : 'panel';
      document.getElementById('pRec').className = t === 'rec' ? 'panel show' : 'panel';
      document.getElementById('tSend').className = t === 'send' ? 'btn active' : 'btn';
      document.getElementById('tRec').className = t === 'rec' ? 'btn active' : 'btn';
    }

    function copiar() {
      navigator.clipboard.writeText(myId);
      alert("ID copiado: " + myId);
    }
    cargar();
  </script>
</body>
</html>
